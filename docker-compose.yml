
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eco-libras-app
    ports:
      - "5000:5000"
    volumes:
      # Mapeia o diretório instance para persistir o banco de dados
      - ./APP/instance:/app/instance
      # Mapeia o código para desenvolvimento (hot reload)
      - ./APP:/app/APP
    env_file:
      - ./APP/.env
    environment:
      - FLASK_ENV=development
      - FLASK_APP=run.py
      - SECRET_KEY=seu-secret-key-aqui
    restart: unless-stopped
    networks:
      - eco-libras-network

networks:
  eco-libras-network:
    driver: bridge
