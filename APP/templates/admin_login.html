<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    .login-container{max-width:420px;margin:40px auto;padding:20px;border:1px solid #ddd;border-radius:6px}
    .form-group{margin-bottom:12px}
    label{display:block;margin-bottom:4px}
    input{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px}
    button{padding:10px 14px;background:#007bff;color:#fff;border:none;border-radius:4px;cursor:pointer}
    #login-message{margin-top:10px;color:red;text-align:center}
  </style>
</head>
<body>
  <div class="login-container">
    <form id="admin-login-form" action="{{ url_for('auth.admin_login') }}" method="post">
      <h2>Login Administrativo</h2>
      <div class="form-group">
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" required>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required>
      </div>
      <div id="login-message">
        {% if request.args.get('failed') %}Credenciais inválidas{% endif %}
      </div>
      <button type="submit">Entrar</button>
    </form>

    <p style="text-align:center;margin-top:12px">
      Ou use AJAX enviando JSON para <code>/admin/login</code> (resposta JSON com redirect_url).
    </p>
  </div>

  <script src="{{ url_for('static', filename='js/admin_auth.js') }}"></script>
</body>
</html>
